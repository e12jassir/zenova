<svg xmlns="http://www.w3.org/2000/svg" width="848" height="204" viewBox="0 0 848 204" role="img" aria-label="Zenova serverless and security architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fb"/>
    </linearGradient>
    <linearGradient id="topSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="78%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="archGlow" cx="0.5" cy="0.5" r="0.45">
      <stop offset="0%" stop-color="#c27803" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#c27803" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="848" height="204" rx="13"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0.5" y="0.5" width="847" height="203" rx="13" fill="url(#bg)" stroke="#d5dce5" stroke-width="1"/>
    <rect width="848" height="204" fill="url(#archGlow)"/>
    <line x1="24" y1="1.2" x2="824" y2="1.2" stroke="url(#topSheen)" stroke-width="1"/>

    <!-- Left: Client Surfaces -->
    <rect x="26" y="24" width="174" height="156" rx="9" fill="#ffffff" stroke="#d5dce5" stroke-width="1"/>
    <text x="38" y="42" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="600" letter-spacing="1.2" fill="#64748b">CLIENT SURFACES</text>
    <rect x="38" y="54" width="150" height="24" rx="5" fill="#f1f4f8" stroke="#e4e8ef" stroke-width="1"/>
    <text x="113" y="69.2" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#475569">Web SPA / PWA</text>
    <rect x="38" y="84" width="150" height="24" rx="5" fill="#f1f4f8" stroke="#e4e8ef" stroke-width="1"/>
    <text x="113" y="99.2" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#475569">Android / TV (.apk)</text>
    <rect x="38" y="114" width="150" height="24" rx="5" fill="#f1f4f8" stroke="#e4e8ef" stroke-width="1"/>
    <text x="113" y="129.2" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#475569">LG webOS (.ipk)</text>
    <rect x="38" y="144" width="150" height="24" rx="5" fill="#f1f4f8" stroke="#e4e8ef" stroke-width="1"/>
    <text x="113" y="159.2" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#475569">Samsung Tizen (.wgt)</text>

    <line x1="200" y1="102" x2="233" y2="102" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M229 99 L234 102 L229 105" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Center: Serverless Edge Layer -->
    <rect x="236" y="24" width="340" height="156" rx="9" fill="#ffffff" stroke="#c27803" stroke-opacity="0.65" stroke-width="1"/>
    <text x="250" y="42" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="600" letter-spacing="1.2" fill="#c27803">SERVERLESS EDGE LAYER (api/)</text>

    <rect x="250" y="55" width="312" height="58" rx="6" fill="#f1f4f8" stroke="#dce2ea" stroke-width="1"/>
    <text x="262" y="75" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#0f172a">/api/stream &#x2192; /api/hls</text>
    <text x="262" y="96" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.8" fill="#64748b">HMAC Verify &#x00b7; Hop-by-Hop SSRF &#x00b7; URI Rewrite</text>

    <rect x="250" y="121" width="312" height="47" rx="6" fill="#f1f4f8" stroke="#dce2ea" stroke-width="1"/>
    <text x="262" y="140" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#0f172a">/api/auth/* &amp; /api/sync</text>
    <text x="262" y="157" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.8" fill="#64748b">Accounts &#x00b7; Profiles &#x00b7; Watch Progress</text>

    <!-- Arrows to backing stores -->
    <line x1="576" y1="84" x2="609" y2="47" stroke="#94a3b8" stroke-width="1.1"/>
    <path d="M604 47 L610 46 L608 52" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="576" y1="144" x2="609" y2="103" stroke="#94a3b8" stroke-width="1.1"/>
    <path d="M604 103 L610 102 L608 108" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right: Upstream & Stores -->
    <rect x="612" y="24" width="210" height="46" rx="7" fill="#ffffff" stroke="#c27803" stroke-opacity="0.65" stroke-width="1"/>
    <text x="625" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Upstream / Public CDN</text>
    <text x="625" y="59" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.8" fill="#64748b">Signed Segments &#x00b7; CORS Safe</text>

    <rect x="612" y="80" width="210" height="46" rx="7" fill="#ffffff" stroke="#d5dce5" stroke-width="1"/>
    <text x="625" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Neon PostgreSQL</text>
    <text x="625" y="115" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.8" fill="#64748b">Serverless Account Sync</text>

    <rect x="612" y="136" width="210" height="44" rx="7" fill="#f1f4f8" stroke="#dce2ea" stroke-dasharray="3 2.5" stroke-width="1"/>
    <text x="625" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">Jellyfin + Tailscale</text>
    <text x="625" y="170" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.8" fill="#64748b">Optional Private Direct HTTPS</text>
  </g>
</svg>
