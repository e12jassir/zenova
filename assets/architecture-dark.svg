<svg xmlns="http://www.w3.org/2000/svg" width="848" height="204" viewBox="0 0 848 204" role="img" aria-label="Zenova serverless and security architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="topSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d4557" stop-opacity="0"/>
      <stop offset="22%" stop-color="#3d4557" stop-opacity="0.65"/>
      <stop offset="78%" stop-color="#3d4557" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3d4557" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="archGlow" cx="0.5" cy="0.5" r="0.45">
      <stop offset="0%" stop-color="#f0a640" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#f0a640" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="848" height="204" rx="13"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0.5" y="0.5" width="847" height="203" rx="13" fill="url(#bg)" stroke="#232833" stroke-width="1"/>
    <rect width="848" height="204" fill="url(#archGlow)"/>
    <line x1="24" y1="1.2" x2="824" y2="1.2" stroke="url(#topSheen)" stroke-width="1"/>

    <!-- Left: Client Surfaces -->
    <rect x="26" y="24" width="174" height="156" rx="9" fill="#11141c" stroke="#232833" stroke-width="1"/>
    <text x="38" y="42" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="600" letter-spacing="1.2" fill="#6c7482">CLIENT SURFACES</text>
    <rect x="38" y="54" width="150" height="24" rx="5" fill="#090b0f" stroke="#1b2029" stroke-width="1"/>
    <text x="113" y="69.2" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#9ca3af">Web SPA / PWA</text>
    <rect x="38" y="84" width="150" height="24" rx="5" fill="#090b0f" stroke="#1b2029" stroke-width="1"/>
    <text x="113" y="99.2" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#9ca3af">Android / TV (.apk)</text>
    <rect x="38" y="114" width="150" height="24" rx="5" fill="#090b0f" stroke="#1b2029" stroke-width="1"/>
    <text x="113" y="129.2" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#9ca3af">LG webOS (.ipk)</text>
    <rect x="38" y="144" width="150" height="24" rx="5" fill="#090b0f" stroke="#1b2029" stroke-width="1"/>
    <text x="113" y="159.2" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#9ca3af">Samsung Tizen (.wgt)</text>

    <line x1="200" y1="102" x2="233" y2="102" stroke="#3e4554" stroke-width="1.2"/>
    <path d="M229 99 L234 102 L229 105" fill="none" stroke="#3e4554" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Center: Serverless Edge Layer -->
    <rect x="236" y="24" width="340" height="156" rx="9" fill="#11141c" stroke="#f0a640" stroke-opacity="0.65" stroke-width="1"/>
    <text x="250" y="42" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="600" letter-spacing="1.2" fill="#f0a640">SERVERLESS EDGE LAYER (api/)</text>

    <rect x="250" y="55" width="312" height="58" rx="6" fill="#090b0f" stroke="#1f242e" stroke-width="1"/>
    <text x="262" y="75" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#f3f4f6">/api/stream &#x2192; /api/hls</text>
    <text x="262" y="96" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.8" fill="#6c7482">HMAC Verify &#x00b7; Hop-by-Hop SSRF &#x00b7; URI Rewrite</text>

    <rect x="250" y="121" width="312" height="47" rx="6" fill="#090b0f" stroke="#1f242e" stroke-width="1"/>
    <text x="262" y="140" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#f3f4f6">/api/auth/* &amp; /api/sync</text>
    <text x="262" y="157" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.8" fill="#6c7482">Accounts &#x00b7; Profiles &#x00b7; Watch Progress</text>

    <!-- Arrows to backing stores -->
    <line x1="576" y1="84" x2="609" y2="47" stroke="#3e4554" stroke-width="1.1"/>
    <path d="M604 47 L610 46 L608 52" fill="none" stroke="#3e4554" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="576" y1="144" x2="609" y2="103" stroke="#3e4554" stroke-width="1.1"/>
    <path d="M604 103 L610 102 L608 108" fill="none" stroke="#3e4554" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right: Upstream & Stores -->
    <rect x="612" y="24" width="210" height="46" rx="7" fill="#11141c" stroke="#f0a640" stroke-opacity="0.65" stroke-width="1"/>
    <text x="625" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f3f4f6">Upstream / Public CDN</text>
    <text x="625" y="59" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.8" fill="#6c7482">Signed Segments &#x00b7; CORS Safe</text>

    <rect x="612" y="80" width="210" height="46" rx="7" fill="#11141c" stroke="#232833" stroke-width="1"/>
    <text x="625" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f3f4f6">Neon PostgreSQL</text>
    <text x="625" y="115" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.8" fill="#6c7482">Serverless Account Sync</text>

    <rect x="612" y="136" width="210" height="44" rx="7" fill="#090b0f" stroke="#1f242e" stroke-dasharray="3 2.5" stroke-width="1"/>
    <text x="625" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9ca3af">Jellyfin + Tailscale</text>
    <text x="625" y="170" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.8" fill="#6c7482">Optional Private Direct HTTPS</text>
  </g>
</svg>
